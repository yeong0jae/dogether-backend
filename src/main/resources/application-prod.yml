server.port: ${APPLICATION_PORT}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa.hibernate.ddl-auto: validate

logging:
  config: classpath:logback/logback-prod.xml
  level:
    root: info
    site.dogether: info
